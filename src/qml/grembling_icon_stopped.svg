<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background (Base) -->
  <rect width="100" height="100" rx="20" ry="20" fill="#1e1e2e"/>

  <!-- Hollow hexagon, no glow filter and dimmed (TopHeader.qml's own
       engineOffColor, #4d6a85) - reads as "off" at a glance next to the
       active icon's bright glowing Mauve, even at tray-icon size. -->
  <polygon points="50,20 80,35 80,65 50,80 20,65 20,35"
           fill="none" stroke="#4d6a85" stroke-width="6"
           stroke-linejoin="round"/>

  <!-- Inner joystick abstract -->
  <circle cx="50" cy="50" r="12" fill="none" stroke="#4d6a85" stroke-width="4"/>

  <line x1="50" y1="50" x2="65" y2="35" stroke="#4d6a85" stroke-width="4" stroke-linecap="round"/>

  <!-- Engine-stopped status badge (bottom-right): same dim slate
       (engineOffColor) as the "ENGINE: OFF" switch state. -->
  <circle cx="78" cy="78" r="16" fill="#1e1e2e"/>
  <circle cx="78" cy="78" r="12" fill="#4d6a85"/>
</svg>
